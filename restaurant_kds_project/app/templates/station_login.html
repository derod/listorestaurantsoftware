<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .pin-wrap { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:60px; width:100%; max-width:1000px; padding:32px; }
    .pin-left { display:flex; flex-direction:column; align-items:center; gap:28px; flex:0 0 auto; }
    .pin-title { font-size:48px; font-weight:800; letter-spacing:1px; }
    .pin-display { background:#10141b; border:2px solid var(--border); border-radius:20px; width:340px; min-height:90px; display:flex; align-items:center; padding:0 28px; font-size:52px; font-weight:700; letter-spacing:10px; color:var(--accent); }
    .pin-display.error-border { border-color:var(--red); }
    .error-msg { font-size:30px; color:var(--red); font-weight:700; min-height:44px; text-align:center; }
    .pin-keypad { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; }
    .pin-btn { width:100px; height:100px; font-size:42px; font-weight:800; border:none; border-radius:20px; background:var(--muted); color:var(--text); cursor:pointer; transition:background 0.12s; display:flex; align-items:center; justify-content:center; }
    .pin-btn:active { background:var(--border); transform:scale(0.96); }
    .pin-btn.borrar { background:#3a2020; color:var(--red); font-size:28px; }
    .pin-btn.entrar { background:var(--accent); color:#111; font-size:28px; grid-column:span 2; width:100%; }
    @media (max-width: 700px) {
      .pin-wrap { flex-direction:column; gap:32px; }
      .pin-btn { width:90px; height:90px; font-size:36px; }
    }
  </style>
</head>
<body>
  <div class="pin-wrap">
    <div class="pin-left">
      <div class="pin-title">SALON</div>
      <div class="pin-display {% if error %}error-border{% endif %}" id="pinDisplay">
        <span id="pinDots"></span>
      </div>
      <div class="error-msg" id="errorMsg">{% if error %}{{ error }}{% endif %}</div>
    </div>

    <form method="post" action="/station-a/login" id="pinForm">
      <input type="hidden" name="pin" id="pinInput" />
      <div class="pin-keypad">
        {% for digit in ['1','2','3','4','5','6','7','8','9'] %}
        <button type="button" class="pin-btn" onclick="appendDigit('{{ digit }}')">{{ digit }}</button>
        {% endfor %}
        <button type="button" class="pin-btn borrar" onclick="borrar()">BORRAR</button>
        <button type="button" class="pin-btn" onclick="appendDigit('0')">0</button>
        <button type="button" class="pin-btn entrar" onclick="submitPin()">ENTRAR</button>
      </div>
    </form>
  </div>

  <script>
    var pin = '';
    function updateDisplay() {
      document.getElementById('pinDots').textContent = '●'.repeat(pin.length) || '';
      document.getElementById('errorMsg').textContent = pin.length > 0 ? '' : (document.getElementById('errorMsg').textContent);
    }
    function appendDigit(d) {
      if (pin.length >= 10) return;
      pin += d;
      updateDisplay();
    }
    function borrar() {
      pin = pin.slice(0, -1);
      updateDisplay();
    }
    function submitPin() {
      if (!pin) return;
      document.getElementById('pinInput').value = pin;
      document.getElementById('pinForm').submit();
    }
    document.addEventListener('keydown', function(e) {
      if (e.key >= '0' && e.key <= '9') appendDigit(e.key);
      else if (e.key === 'Backspace') borrar();
      else if (e.key === 'Enter') submitPin();
    });
  </script>
</body>
</html>
