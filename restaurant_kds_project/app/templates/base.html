<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">LISTO Restaurant Software</div>
    <nav class="nav">
      {% if request.url.path.startswith('/admin') %}
      <a href="/admin">Admin</a>
      <a href="/admin/products">Productos</a>
      <a href="/admin/inventory">Inventario</a>
      <a href="/admin/inventario">Insumos</a>
      <a href="/admin/logs">Logs</a>
      <a href="/admin/orders/history">Órdenes</a>
      <a href="/admin/reports">Reportes</a>
      <a href="/admin/pos-settings">POS</a>
      <a href="/admin/audio">Audio</a>
      <a href="/admin/waiters">Agentes</a>
      <a href="/admin/logout" style="background:rgba(228,91,91,0.18);color:var(--red);">Salir Admin</a>
      {% endif %}
    </nav>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
  <script>
  (function () {
    window.__audioUnlocked = false;
    window.unlockAudio = function () {
      if (window.__audioUnlocked) return true;
      try {
        document.querySelectorAll("audio").forEach(function (a) {
          try {
            var p = a.play();
            if (p && p.then) p.then(function () { a.pause(); a.currentTime = 0; }).catch(function () {});
          } catch (e) {}
        });
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            var ctx = window.__audioCtx || (window.__audioCtx = new AC());
            if (ctx.state === "suspended") ctx.resume();
            var buf = ctx.createBuffer(1, 1, 22050);
            var src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            src.start(0);
          }
        } catch (e) {}
      } catch (e) {}
      window.__audioUnlocked = true;
      var btn = document.getElementById("audioUnlockBtn");
      if (btn) {
        btn.textContent = "🔔 Alertas activadas";
        btn.disabled = true;
        btn.style.opacity = "0.6";
      }
      return true;
    };
    ["click", "touchstart", "keydown"].forEach(function (ev) {
      document.addEventListener(ev, function once() {
        window.unlockAudio();
        document.removeEventListener(ev, once);
      }, { once: true });
    });
  })();
  </script>
</body>
</html>
