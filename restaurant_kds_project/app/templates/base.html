<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/static/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/css/styles.css?v=touch" />
  <style>
    .lang-switch { display:flex; gap:4px; }
    .lang-switch .lang-btn { font-size:15px; font-weight:800; padding:8px 12px; border-radius:10px; background:var(--muted); color:var(--text); text-decoration:none; border:1px solid var(--border); }
    .lang-switch .lang-btn.on { background:var(--accent); color:#111; border-color:var(--accent); }
  </style>
  <script>window.LANG={{ cur_lang(request)|tojson }};window.I18N={{ i18n_dict(cur_lang(request))|tojson }};</script>
</head>
<body>
  <header class="topbar">
    <div class="brand">LISTO Restaurant Software</div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <nav class="nav">
        {% if request.url.path.startswith('/admin') %}
        <a href="/admin">Admin</a>
        <a href="/admin/products">Productos</a>
        <a href="/admin/inventario">Insumos</a>
        <a href="/admin/logs">Logs</a>
        <a href="/admin/orders/history">Órdenes</a>
        <a href="/admin/reports">Reportes</a>
        <a href="/admin/pos-settings">POS</a>
        <a href="/admin/audio">Audio</a>
        <a href="/admin/waiters">Agentes</a>
        <a href="/admin/logout" style="background:rgba(228,91,91,0.18);color:var(--red);">Salir Admin</a>
        {% endif %}
      </nav>
      <div class="lang-switch">
        {% set _cl = cur_lang(request) %}
        {% for code in i18n_langs %}
        <a href="/idioma/{{ code }}?next={{ request.url.path }}" class="lang-btn{{ ' on' if _cl == code else '' }}">{{ i18n_labels[code] }}</a>
        {% endfor %}
      </div>
    </div>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>

  <!-- Shared in-page confirm modal (replaces native confirm/alert) -->
  <div class="ui-confirm-overlay" id="confirmOverlay">
    <div class="ui-confirm-box">
      <div class="ui-confirm-msg" id="confirmMsg"></div>
      <div class="ui-confirm-actions">
        <button class="ui-confirm-no" id="confirmNo">No</button>
        <button class="ui-confirm-yes" id="confirmYes">Sí</button>
      </div>
    </div>
  </div>
  <style>
    .ui-confirm-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:100001; align-items:center; justify-content:center; padding:20px; }
    .ui-confirm-overlay.open { display:flex; }
    .ui-confirm-box { background:var(--bg,#0f1115); border:1px solid var(--border,#3a4150); border-radius:20px; padding:26px; width:100%; max-width:400px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.5); }
    .ui-confirm-msg { font-size:24px; font-weight:800; margin-bottom:20px; color:var(--text,#fff); }
    .ui-confirm-actions { display:flex; gap:12px; }
    .ui-confirm-actions button { flex:1; min-height:60px; border:none; border-radius:14px; font-size:20px; font-weight:800; cursor:pointer; }
    .ui-confirm-no { background:var(--muted,#2a2f3a); color:var(--text,#fff); }
    .ui-confirm-yes { background:var(--red,#e45b5b); color:#fff; }
  </style>
  <script>
  (function () {
    window.askConfirm = function (msg, opts) {
      opts = opts || {};
      return new Promise(function (resolve) {
        var ov = document.getElementById("confirmOverlay");
        if (!ov) { resolve(window.confirm(msg)); return; }
        document.getElementById("confirmMsg").textContent = msg;
        var yes = document.getElementById("confirmYes");
        var no = document.getElementById("confirmNo");
        yes.textContent = opts.yes || "Sí";
        no.textContent = opts.no || "No";
        ov.classList.add("open");
        function done(v) {
          ov.classList.remove("open");
          yes.removeEventListener("click", oy);
          no.removeEventListener("click", on);
          ov.removeEventListener("click", ob);
          resolve(v);
        }
        function oy() { done(true); }
        function on() { done(false); }
        function ob(e) { if (e.target === ov) done(false); }
        yes.addEventListener("click", oy);
        no.addEventListener("click", on);
        ov.addEventListener("click", ob);
      });
    };
    window.confirmForm = function (form, msg) {
      window.askConfirm(msg, { yes: "Sí" }).then(function (ok) { if (ok) form.submit(); });
      return false;
    };
    window.toast = function (msg, ok) {
      var host = document.getElementById("uiToastHost");
      if (!host) {
        host = document.createElement("div");
        host.id = "uiToastHost";
        host.style.cssText = "position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100000;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;";
        document.body.appendChild(host);
      }
      var t = document.createElement("div");
      t.textContent = msg;
      t.style.cssText = "pointer-events:auto;padding:14px 22px;border-radius:12px;font-size:18px;font-weight:800;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(-10px);transition:opacity .2s,transform .2s;background:" + ((ok === false) ? "#c62828" : "#2e7d32") + ";";
      host.appendChild(t);
      requestAnimationFrame(function () { t.style.opacity = "1"; t.style.transform = "translateY(0)"; });
      setTimeout(function () { t.style.opacity = "0"; t.style.transform = "translateY(-10px)"; setTimeout(function () { t.remove(); }, 250); }, 2600);
    };
  })();
  </script>
  <script>
  (function () {
    window.__audioUnlocked = false;
    window.unlockAudio = function () {
      if (window.__audioUnlocked) return true;
      try {
        document.querySelectorAll("audio").forEach(function (a) {
          try {
            var p = a.play();
            if (p && p.then) p.then(function () { a.pause(); a.currentTime = 0; }).catch(function () {});
          } catch (e) {}
        });
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            var ctx = window.__audioCtx || (window.__audioCtx = new AC());
            if (ctx.state === "suspended") ctx.resume();
            var buf = ctx.createBuffer(1, 1, 22050);
            var src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            src.start(0);
          }
        } catch (e) {}
      } catch (e) {}
      window.__audioUnlocked = true;
      window.userInteracted = true;
      var btn = document.getElementById("audioUnlockBtn");
      if (btn) {
        btn.textContent = "🔔 Alertas activadas";
        btn.disabled = true;
        btn.style.opacity = "0.6";
      }
      return true;
    };
    ["click", "touchstart", "keydown"].forEach(function (ev) {
      document.addEventListener(ev, function once() {
        window.unlockAudio();
        document.removeEventListener(ev, once);
      }, { once: true });
    });
  })();
  </script>
</body>
</html>
