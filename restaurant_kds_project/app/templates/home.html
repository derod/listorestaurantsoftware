{% extends 'base.html' %}
{% block content %}
<style>
  .home-wrap {
    min-height: calc(100vh - 90px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  .home-title {
    font-size: clamp(40px, 6vw, 72px);
    font-weight: 800;
    letter-spacing: -1px;
    margin: 0 0 12px;
    background: linear-gradient(90deg, var(--accent), #7aa2ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .home-sub {
    color: #6c757d;
    font-size: 18px;
    margin-bottom: 48px;
  }
  .home-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    width: 100%;
    max-width: 900px;
  }
  .home-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 40px 24px;
    border-radius: 24px;
    background: var(--card);
    border: 2px solid var(--border);
    color: inherit;
    text-decoration: none;
    font-size: 28px;
    font-weight: 700;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .home-btn:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }
  .home-btn .icon { font-size: 56px; line-height: 1; }
  .home-btn.salon { border-color: rgba(104, 211, 145, 0.35); }
  .home-btn.kitchen { border-color: rgba(245, 197, 24, 0.35); }
  .home-btn.admin { border-color: rgba(228, 91, 91, 0.35); }
  .home-btn.inventario { border-color: rgba(77, 163, 255, 0.35); }
  .home-btn.pos { border-color: rgba(167, 139, 250, 0.45); }
</style>

<div class="home-wrap">
  <h1 class="home-title">Listo Restaurant Software</h1>
  <div class="home-sub">Selecciona una pantalla para continuar</div>

  <div class="home-grid">
    <a href="/station-a" class="home-btn salon">
      <div class="icon">&#127869;</div>
      <div>Salón</div>
    </a>
    <a href="/kitchen" class="home-btn kitchen">
      <div class="icon">&#128066;</div>
      <div>Kitchen</div>
    </a>
    <a href="/admin" class="home-btn admin">
      <div class="icon">&#128273;</div>
      <div>Admin</div>
    </a>
    <a href="/inventory" class="home-btn inventario">
      <div class="icon">&#128230;</div>
      <div>Inventario</div>
    </a>
    <a href="/pos" class="home-btn pos">
      <div class="icon">&#128181;</div>
      <div>Punto de Venta</div>
    </a>
  </div>
</div>
{% endblock %}
