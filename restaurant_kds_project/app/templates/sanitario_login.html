<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/static/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/static/css/styles.css?v=touch" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .pin-wrap { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:60px; width:100%; max-width:1000px; padding:32px; }
    .pin-left { display:flex; flex-direction:column; align-items:center; gap:22px; flex:0 0 auto; }
    .pin-kicker { font-size:18px; font-weight:800; letter-spacing:0.18em; text-transform:uppercase; color:var(--green); }
    .pin-title { font-size:44px; font-weight:800; letter-spacing:1px; text-align:center; }
    .pin-display { background:#10141b; border:2px solid var(--border); border-radius:20px; width:340px; min-height:90px; display:flex; align-items:center; padding:0 28px; font-size:52px; font-weight:700; letter-spacing:10px; color:var(--green); }
    .pin-display.error-border { border-color:var(--red); }
    .error-msg { font-size:26px; color:var(--red); font-weight:700; min-height:40px; text-align:center; }
    .pin-keypad { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; }
    .pin-btn { width:100px; height:100px; font-size:42px; font-weight:800; border:none; border-radius:20px; background:var(--muted); color:var(--text); cursor:pointer; transition:background 0.12s; display:flex; align-items:center; justify-content:center; }
    .pin-btn:active { background:var(--border); transform:scale(0.96); }
    .pin-btn.borrar { background:#3a2020; color:var(--red); font-size:28px; }
    .pin-btn.entrar { background:var(--green); color:#08210c; font-size:28px; grid-column:span 2; width:100%; }
    @media (max-width: 700px) {
      .pin-wrap { flex-direction:column; gap:28px; }
      .pin-btn { width:90px; height:90px; font-size:36px; }
    }
    /* Regresar a las estaciones */
    .stage { display:flex; flex-direction:column; align-items:center; gap:30px; width:100%; }
    .back-stations { text-align:center; padding:0 16px; }
    .back-stations .legend { font-size:20px; font-weight:700; color:#b7becd; margin-bottom:16px; }
    .station-links { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
    .station-links a { display:inline-flex; align-items:center; gap:10px; min-height:60px; padding:0 30px; border-radius:16px; font-size:22px; font-weight:800; text-decoration:none; border:1px solid var(--border); background:var(--muted); color:var(--text); transition:transform .1s, border-color .15s; }
    .station-links a:active { transform:scale(0.97); }
    .station-links a.cocina { background:rgba(77,163,255,0.14); color:var(--blue); border-color:rgba(77,163,255,0.45); }
    .station-links a.salon  { background:rgba(255,140,66,0.14); color:var(--accent); border-color:rgba(255,140,66,0.45); }
    .station-links a.admin  { background:rgba(228,91,91,0.12); color:var(--red); border-color:rgba(228,91,91,0.4); }
    @media (max-width: 700px) {
      .station-links a { font-size:19px; min-height:54px; padding:0 22px; }
    }
  </style>
</head>
<body>
  {% include '_lang_switch.html' %}
  <div class="stage">
  <div class="pin-wrap">
    <div class="pin-left">
      <div class="pin-kicker">LISTO · Control Sanitario</div>
      <div class="pin-title">HIGIENE Y LIMPIEZA</div>
      <div class="pin-display {% if error %}error-border{% endif %}" id="pinDisplay">
        <span id="pinDots"></span>
      </div>
      <div class="error-msg" id="errorMsg">{% if error %}{{ error }}{% endif %}</div>
    </div>

    <form method="post" action="/sanitario/login" id="pinForm">
      <input type="hidden" name="pin" id="pinInput" />
      <input type="hidden" name="next" value="{{ next }}" />
      <div class="pin-keypad">
        {% for digit in ['1','2','3','4','5','6','7','8','9'] %}
        <button type="button" class="pin-btn" onclick="appendDigit('{{ digit }}')">{{ digit }}</button>
        {% endfor %}
        <button type="button" class="pin-btn borrar" onclick="borrar()">BORRAR</button>
        <button type="button" class="pin-btn" onclick="appendDigit('0')">0</button>
        <button type="button" class="pin-btn entrar" onclick="submitPin()">ENTRAR</button>
      </div>
    </form>
  </div>

    <div class="back-stations">
      <div class="legend">¿Quieres regresar a las estaciones?</div>
      <div class="station-links">
        <a class="cocina" href="/kitchen">🍳 Cocina</a>
        <a class="salon" href="/station-a">🍽️ Salón</a>
        <a class="admin" href="/admin">⚙️ Admin</a>
      </div>
    </div>
  </div>

  <script>
    var pin = '';
    function updateDisplay() {
      document.getElementById('pinDots').textContent = '●'.repeat(pin.length) || '';
    }
    function appendDigit(d) { if (pin.length >= 10) return; pin += d; updateDisplay(); }
    function borrar() { pin = pin.slice(0, -1); updateDisplay(); }
    function submitPin() {
      if (!pin) return;
      document.getElementById('pinInput').value = pin;
      document.getElementById('pinForm').submit();
    }
    document.addEventListener('keydown', function(e) {
      if (e.key >= '0' && e.key <= '9') appendDigit(e.key);
      else if (e.key === 'Backspace') borrar();
      else if (e.key === 'Enter') submitPin();
    });
  </script>
</body>
</html>
