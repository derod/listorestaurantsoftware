<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A5%A4</text></svg>" />
  <link rel="stylesheet" href="/static/css/styles.css?v=touch" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--brand-grad); padding:20px; }
    .pin-wrap { display:flex; flex-direction:row; align-items:center; justify-content:center; gap:48px; width:100%; max-width:1000px; padding:40px; background:#fff; border-radius:28px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .pin-left { display:flex; flex-direction:column; align-items:center; gap:28px; flex:0 0 auto; }
    .pin-logo { font-size:56px; line-height:1; }
    .pin-title { font-size:40px; font-weight:800; letter-spacing:1px; }
    .pin-sub { color:#6c757d; font-size:18px; margin-top:-16px; }
    .pin-display { background:#f3f4f6; border:2px solid #d9ddea; border-radius:20px; width:340px; min-height:90px; display:flex; align-items:center; padding:0 28px; font-size:52px; font-weight:700; letter-spacing:10px; color:var(--accent); }
    .pin-display.error-border { border-color:var(--red); }
    .error-msg { font-size:26px; color:#c0392b; font-weight:700; min-height:40px; text-align:center; }
    .pin-keypad { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; }
    .pin-btn { width:100px; height:100px; font-size:42px; font-weight:800; border:none; border-radius:20px; background:#f3f4f6; color:#374151; cursor:pointer; transition:background 0.12s; display:flex; align-items:center; justify-content:center; }
    .pin-btn:active { background:#e5e7eb; transform:scale(0.96); }
    .pin-btn.borrar { background:#fdecec; color:#c0392b; font-size:28px; }
    .pin-btn.entrar { background:var(--accent); color:#fff; font-size:28px; grid-column:span 2; width:100%; }
    .back-link { position:fixed; top:20px; left:20px; color:#6c757d; text-decoration:none; font-size:16px; }
    .back-link:hover { color:var(--accent); }
    @media (max-width: 700px) {
      .pin-wrap { flex-direction:column; gap:28px; padding:24px; }
      .pin-btn { width:90px; height:90px; font-size:36px; }
    }
  </style>
</head>
<body>
  {% include '_lang_switch.html' %}
  <a href="/" class="back-link">← Inicio</a>
  <div class="pin-wrap">
    <div class="pin-left">
      <div class="pin-logo">🥤</div>
      <div class="pin-title">INVENTARIO</div>
      <div class="pin-sub">Ingresa tu código</div>
      <div class="pin-display {% if error %}error-border{% endif %}" id="pinDisplay">
        <span id="pinDots"></span>
      </div>
      <div class="error-msg" id="errorMsg">{% if error %}{{ error }}{% endif %}</div>
    </div>

    <form method="post" action="/inventory/login" id="pinForm">
      <input type="hidden" name="pin" id="pinInput" />
      <div class="pin-keypad">
        {% for digit in ['1','2','3','4','5','6','7','8','9'] %}
        <button type="button" class="pin-btn" onclick="appendDigit('{{ digit }}')">{{ digit }}</button>
        {% endfor %}
        <button type="button" class="pin-btn borrar" onclick="borrar()">BORRAR</button>
        <button type="button" class="pin-btn" onclick="appendDigit('0')">0</button>
        <button type="button" class="pin-btn entrar" onclick="submitPin()">ENTRAR</button>
      </div>
    </form>
  </div>

  <script>
    var pin = '';
    function updateDisplay() {
      document.getElementById('pinDots').textContent = '●'.repeat(pin.length) || '';
    }
    function appendDigit(d) {
      if (pin.length >= 10) return;
      pin += d;
      updateDisplay();
    }
    function borrar() { pin = pin.slice(0, -1); updateDisplay(); }
    function submitPin() {
      if (!pin) return;
      document.getElementById('pinInput').value = pin;
      document.getElementById('pinForm').submit();
    }
    document.addEventListener('keydown', function(e) {
      if (e.key >= '0' && e.key <= '9') appendDigit(e.key);
      else if (e.key === 'Backspace') borrar();
      else if (e.key === 'Enter') submitPin();
    });
  </script>
</body>
</html>
