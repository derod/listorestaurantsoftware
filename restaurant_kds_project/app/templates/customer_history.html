<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Visitas - Soda Silvia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .page-header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .btn-back {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn-back:hover { background: rgba(255,255,255,0.3); }
        .page-header h1 { font-size: 22px; color: #FFD700; }
        .section-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .visit-item {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .visit-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .visit-badge.qr { background: #667eea; color: white; }
        .visit-badge.manual { background: #8b5cf6; color: white; }
        .empty-message {
            text-align: center;
            color: rgba(255,255,255,0.6);
            padding: 24px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 4px;
        }
        .btn-page {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-page:hover:not(:disabled) { background: rgba(255,255,255,0.25); }
        .btn-page:disabled { opacity: 0.4; cursor: default; }
        .page-info { font-size: 14px; color: rgba(255,255,255,0.8); }
        #loadingMsg { text-align: center; padding: 24px; color: rgba(255,255,255,0.7); }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <a href="/cliente/dashboard" class="btn-back">← Volver</a>
            <h1>📋 Historial de Visitas</h1>
        </div>

        <div class="section-card">
            <div id="loadingMsg">Cargando...</div>
            <div id="visitsList"></div>
        </div>

        <div class="pagination">
            <button class="btn-page" id="btnPrev" onclick="changePage(-1)" disabled>← Anterior</button>
            <span class="page-info" id="pageInfo"></span>
            <button class="btn-page" id="btnNext" onclick="changePage(1)" disabled>Siguiente →</button>
        </div>
    </div>

    <script>
        var currentPage = 1;
        var perPage = 50;

        document.addEventListener('DOMContentLoaded', function() {
            var loginType = localStorage.getItem('login_type');
            var loginIdentifier = localStorage.getItem('login_identifier');
            if (!loginType || !loginIdentifier) {
                window.location.href = '/cliente/login';
                return;
            }
            loadPage(1);
        });

        async function loadPage(page) {
            var loginType = localStorage.getItem('login_type');
            var loginIdentifier = localStorage.getItem('login_identifier');
            document.getElementById('loadingMsg').style.display = 'block';
            document.getElementById('visitsList').innerHTML = '';

            try {
                var res = await fetch(
                    '/cliente/api/visits?login_type=' + encodeURIComponent(loginType) +
                    '&login_identifier=' + encodeURIComponent(loginIdentifier) +
                    '&page=' + page + '&per_page=' + perPage
                );
                if (!res.ok) throw new Error('Error');
                var data = await res.json();

                document.getElementById('loadingMsg').style.display = 'none';
                currentPage = data.page;

                if (data.items.length === 0) {
                    document.getElementById('visitsList').innerHTML = '<p class="empty-message">No hay visitas registradas</p>';
                } else {
                    var html = '';
                    data.items.forEach(function(v) {
                        var badgeClass = (v.source === 'qr' || v.source === 'qr_scan') ? 'qr' : 'manual';
                        var badgeLabel = (v.source === 'qr' || v.source === 'qr_scan') ? '📱 QR' : '✏️ Manual';
                        html += '<div class="visit-item">' +
                            '<div><strong>' + v.date + '</strong> ' + v.time +
                            '<br><small style="color:rgba(255,255,255,0.7)">+' + v.stars_earned +
                            ' estrella' + (v.stars_earned > 1 ? 's' : '') + '</small></div>' +
                            '<span class="visit-badge ' + badgeClass + '">' + badgeLabel + '</span>' +
                            '</div>';
                    });
                    document.getElementById('visitsList').innerHTML = html;
                }

                var total = data.total;
                var totalPages = Math.ceil(total / perPage) || 1;
                document.getElementById('pageInfo').textContent = 'Página ' + currentPage + ' de ' + totalPages + ' (' + total + ' visitas)';
                document.getElementById('btnPrev').disabled = !data.has_prev;
                document.getElementById('btnNext').disabled = !data.has_next;
            } catch(e) {
                document.getElementById('loadingMsg').textContent = 'Error al cargar el historial.';
            }
        }

        function changePage(delta) {
            loadPage(currentPage + delta);
        }
    </script>
</body>
</html>
