<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A5%A4</text></svg>" />
  <link rel="stylesheet" href="/static/css/styles.css?v=touch" />
  <style>
    body { background:var(--brand-grad); }
    .login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .login-box { background:#fff; border-radius:28px; padding:44px 46px; width:100%; max-width:520px; display:flex; flex-direction:column; gap:24px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
    .login-logo { text-align:center; font-size:52px; line-height:1; }
    .login-box h1 { text-align:center; margin:0; font-size:34px; color:#667eea; }
    .field { display:flex; flex-direction:column; gap:10px; }
    .field label { font-size:22px; color:#374151; font-weight:700; }
    .field input { font-size:26px; min-height:64px; border-radius:14px; border:1px solid #d9ddea; background:#fff; color:#374151; padding:14px 18px; }
    .field input:focus { outline:none; border-color:#667eea; }
    .login-btn { min-height:70px; font-size:28px; font-weight:800; border:none; border-radius:16px; background:var(--brand-grad); color:#fff; cursor:pointer; }
    .error-msg { background:#fdecec; border:1px solid #f5b5b5; border-radius:14px; padding:16px; font-size:22px; color:#c0392b; text-align:center; }
  </style>
</head>
<body>
  {% include '_lang_switch.html' %}
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">🥤</div>
      <h1>Soda Silvia · Admin</h1>
      {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
      <form method="post" action="/admin/login">
        <div style="display:flex;flex-direction:column;gap:20px;">
          <div class="field">
            <label>Email</label>
            <input type="email" name="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label>Contraseña</label>
            <input type="password" name="passcode" autocomplete="current-password" required />
          </div>
          <button type="submit" class="login-btn">Entrar</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
