{% extends 'base.html' %}
{% block content %}
<h1>Admin Productos</h1>
<div class="panel form-panel">
  <form method="post" action="/admin/products" class="big-form">
    <input name="name" placeholder="Nombre del producto" required />
    <button class="action primary" type="submit">+ Agregar producto</button>
  </form>
</div>
<div class="table-card">
  <table class="big-table">
    <thead><tr><th>Foto</th><th>Orden</th><th>Nombre</th><th>Precio</th><th>Activo</th><th>Acciones</th></tr></thead>
    <tbody>
      {% for p in products %}
      <tr>
        <td>
          {% if p.image_path %}
          <img src="{{ p.image_path }}" alt="{{ p.name }}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--border);">
          {% else %}
          <div style="width:64px;height:64px;border-radius:10px;background:#10141b;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#6c757d;font-size:12px;">Sin foto</div>
          {% endif %}
        </td>
        <td>{{ p.display_order }}</td>
        <td>{{ p.name }}</td>
        <td>
          <form method="post" action="/admin/products/{{ p.id }}/price" style="display:inline-flex;gap:6px;align-items:center;">
            <input type="number" step="0.01" min="0" name="price" value="{{ '%.2f'|format(p.price or 0) }}" style="width:90px;" />
            <button class="small-action" type="submit">Guardar</button>
          </form>
        </td>
        <td>{{ 'Sí' if p.active else 'No' }}</td>
        <td class="actions-cell">
          <form method="post" action="/admin/products/{{ p.id }}/photo" enctype="multipart/form-data" style="display:inline-flex;gap:6px;align-items:center;">
            <input type="file" name="photo" accept="image/*" required style="max-width:160px;">
            <button class="small-action" type="submit">Subir foto</button>
          </form>
          <form method="post" action="/admin/products/{{ p.id }}/toggle"><button class="small-action" type="submit">{{ 'Desactivar' if p.active else 'Activar' }}</button></form>
          <form method="post" action="/admin/products/{{ p.id }}/move"><input type="hidden" name="direction" value="up"><button class="small-action" type="submit">Arriba</button></form>
          <form method="post" action="/admin/products/{{ p.id }}/move"><input type="hidden" name="direction" value="down"><button class="small-action" type="submit">Abajo</button></form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
