{% extends 'base.html' %}
{% block content %}
<style>
  .em-head { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:10px; }
  .em-head h1 { margin:0; font-size:30px; }
  .em-btn { border:none; border-radius:12px; padding:12px 18px; font-weight:800; font-size:16px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
  .em-save { background:var(--accent); color:#111; }
  .em-back { background:var(--muted); color:var(--text); }
  .em-add { background:rgba(77,163,255,0.2); color:var(--blue); }
  .em-sub { color:#b7becd; font-size:15px; margin-bottom:14px; }

  .floor {
    position:relative; width:100%; max-width:560px; margin:0 auto; aspect-ratio: 3 / 4;
    background:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px) 0 0 / 40px 40px,
      #241a12;
    border:2px solid var(--border); border-radius:18px; overflow:hidden; touch-action:none;
  }
  .etable {
    position:absolute; transform:translate(-50%,-50%);
    background:var(--muted); border:2px solid var(--accent); color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:grab; user-select:none; box-shadow:0 6px 16px rgba(0,0,0,0.4); text-align:center;
  }
  .etable.round { width:66px; height:66px; border-radius:50%; }
  .etable.rect  { width:88px; height:58px; border-radius:12px; }
  .etable.dragging { border-color:#ff8c42; box-shadow:0 10px 26px rgba(0,0,0,0.6); z-index:5; }
  .etable .lbl { font-size:20px; font-weight:900; line-height:1; }
  .etable .cap { font-size:11px; font-weight:700; color:#cbd3e1; }

  .em-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:1000; align-items:center; justify-content:center; padding:20px; }
  .em-overlay.open { display:flex; }
  .em-modal { background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:24px; width:100%; max-width:400px; }
  .em-modal h2 { margin:0 0 16px; font-size:22px; }
  .em-field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .em-field label { font-size:14px; font-weight:800; color:#b7becd; }
  .em-field input, .em-field select { background:#10141b; border:1px solid var(--border); border-radius:12px; padding:14px; font-size:18px; color:#fff; font-family:inherit; outline:none; }
  .em-modal-actions { display:flex; gap:10px; }
  .em-modal-actions button { flex:1; min-height:54px; border:none; border-radius:12px; font-size:16px; font-weight:800; cursor:pointer; }
  .em-del { background:rgba(228,91,91,0.18); color:var(--red); border:2px solid rgba(228,91,91,0.5) !important; }
  .em-ok { background:var(--accent); color:#111; }
</style>

<div class="em-head">
  <h1>{{ t('mes.title') }}</h1>
  <div style="display:flex;gap:10px;flex-wrap:wrap;">
    <a href="/mesas" class="em-btn em-back">{{ t('mes.ver_plano') }}</a>
    <button type="button" class="em-btn em-add" id="addBtn">{{ t('mes.agregar') }}</button>
    <button type="button" class="em-btn em-back" id="resetBtn">{{ t('mes.plano_l') }}</button>
    <button type="button" class="em-btn em-save" id="saveBtn">💾 {{ t('common.guardar') }}</button>
  </div>
</div>
<div class="em-sub">{{ t('mes.sub') }}</div>

<div class="floor" id="floor"></div>

<div class="em-overlay" id="editModal">
  <div class="em-modal">
    <h2 id="emTitle">{{ t('mes.mesa') }}</h2>
    <div class="em-field">
      <label for="emLabel">{{ t('mes.etiqueta') }}</label>
      <input id="emLabel" type="text" maxlength="60" placeholder="{{ t('mes.etiqueta_ph') }}">
    </div>
    <div class="em-field">
      <label for="emCap">{{ t('mes.capacidad') }}</label>
      <select id="emCap">
        <option value="2">{{ t('mes.cap2') }}</option>
        <option value="4">{{ t('mes.cap4') }}</option>
        <option value="6">{{ t('mes.cap6') }}</option>
      </select>
    </div>
    <div class="em-modal-actions" style="margin-bottom:12px;">
      <button type="button" class="em-del" id="emDel">{{ t('mes.eliminar') }}</button>
    </div>
    <div class="em-modal-actions">
      <button type="button" class="em-back" id="emCancel">{{ t('common.cancelar') }}</button>
      <button type="button" class="em-ok" id="emOk">{{ t('mes.listo') }}</button>
    </div>
  </div>
</div>

<script>
(function () {
  const T = (k, fb) => (window.I18N && window.I18N[k]) || fb;
  const floor = document.getElementById("floor");
  const LAYOUT_L = {
    1:{x:15,y:8}, 2:{x:15,y:17}, 3:{x:15,y:26}, 4:{x:15,y:35}, 5:{x:15,y:44}, 6:{x:15,y:53}, 7:{x:15,y:62},
    8:{x:15,y:74}, 12:{x:45,y:74}, 11:{x:75,y:74}, 14:{x:45,y:88}, 13:{x:75,y:88}
  };
  let state = [];        // {id|null, number, name, capacity, x, y}
  let deletedIds = [];
  let editIdx = null;

  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }
  function labelOf(t){ return (t.name && t.name.trim()) ? t.name.trim() : String(t.number); }
  function maxNum(){ return state.reduce((m,t)=>Math.max(m, t.number||0), 0); }

  function render() {
    floor.innerHTML = "";
    state.forEach((t, idx) => {
      const el = document.createElement("div");
      const round = (t.capacity || 4) <= 2;
      el.className = "etable " + (round ? "round" : "rect");
      el.style.left = t.x + "%";
      el.style.top = t.y + "%";
      el.dataset.idx = idx;
      el.innerHTML = `<div class="lbl">${esc(labelOf(t))}</div><div class="cap">${t.capacity||4} ${T("mes.pers","pers")}</div>`;
      floor.appendChild(el);
      wireDrag(el, t, idx);
    });
  }

  function wireDrag(el, t, idx) {
    let moved = false, sx = 0, sy = 0;
    el.addEventListener("pointerdown", e => {
      el.classList.add("dragging"); moved = false; sx = e.clientX; sy = e.clientY;
      try { el.setPointerCapture(e.pointerId); } catch(_){}
    });
    el.addEventListener("pointermove", e => {
      if (!el.classList.contains("dragging")) return;
      if (Math.abs(e.clientX-sx) > 5 || Math.abs(e.clientY-sy) > 5) moved = true;
      const r = floor.getBoundingClientRect();
      t.x = Math.max(0, Math.min(100, (e.clientX-r.left)/r.width*100));
      t.y = Math.max(0, Math.min(100, (e.clientY-r.top)/r.height*100));
      el.style.left = t.x + "%"; el.style.top = t.y + "%";
    });
    const end = () => {
      el.classList.remove("dragging");
      if (!moved) openEdit(idx);
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", () => el.classList.remove("dragging"));
  }

  // ── Modal de edición ──
  const modal = document.getElementById("editModal");
  function openEdit(idx) {
    editIdx = idx;
    const t = state[idx];
    document.getElementById("emTitle").textContent = T("mes.mesa","Mesa") + " " + labelOf(t);
    document.getElementById("emLabel").value = t.name || "";
    document.getElementById("emCap").value = String(t.capacity || 4);
    modal.classList.add("open");
  }
  function closeEdit() { editIdx = null; modal.classList.remove("open"); }
  document.getElementById("emCancel").addEventListener("click", closeEdit);
  modal.addEventListener("click", e => { if (e.target === modal) closeEdit(); });
  document.getElementById("emOk").addEventListener("click", () => {
    if (editIdx == null) return;
    const t = state[editIdx];
    t.name = document.getElementById("emLabel").value.trim();
    t.capacity = parseInt(document.getElementById("emCap").value, 10) || 4;
    render(); closeEdit();
  });
  document.getElementById("emDel").addEventListener("click", async () => {
    if (editIdx == null) return;
    const t = state[editIdx];
    const ok = await window.askConfirm(`${T("mes.conf_eliminar","¿Eliminar la mesa")} ${labelOf(t)}?`, { yes: T("common.eliminar","Eliminar") });
    if (!ok) return;
    if (t.id != null) deletedIds.push(t.id);
    state.splice(editIdx, 1);
    render(); closeEdit();
  });

  document.getElementById("addBtn").addEventListener("click", () => {
    state.push({ id: null, number: maxNum() + 1, name: "", capacity: 4, x: 50, y: 45 });
    render();
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    state.forEach(t => { const d = LAYOUT_L[t.number]; if (d) { t.x = d.x; t.y = d.y; } });
    render();
  });

  document.getElementById("saveBtn").addEventListener("click", async () => {
    const payload = {
      tables: state.map(t => ({ id: t.id, number: t.number, name: t.name || null, capacity: t.capacity || 4, pos_x: t.x, pos_y: t.y })),
      deleted_ids: deletedIds,
    };
    try {
      const res = await fetch("/admin/mesas/save", {
        method: "POST", headers: { "Content-Type": "application/json" },
        credentials: "same-origin", body: JSON.stringify(payload),
      });
      if (!res.ok) { const d = await res.json().catch(()=>({})); throw new Error(d.detail || "Error"); }
      deletedIds = [];
      window.toast(T("mes.guardado","Plano guardado."));
    } catch (e) { window.toast(e.message || T("mes.no_guardar","No se pudo guardar."), false); }
  });

  async function load() {
    try {
      const res = await fetch("/api/tables", { credentials: "same-origin" });
      const tabs = await res.json();
      state = tabs.map((t, i) => {
        let x = t.pos_x, y = t.pos_y;
        if (x == null || y == null) { const d = LAYOUT_L[t.number] || { x: 50, y: 50 }; x = d.x; y = d.y; }
        return { id: t.id, number: t.number, name: t.name || "", capacity: t.capacity || 4, x, y };
      });
      render();
    } catch (e) {}
  }
  load();
})();
</script>
{% endblock %}
